# ============================================================================
# Zensical configuration for EOEPCA Document Template
# Migrated from mkdocs.yml
# See https://zensical.org/docs/ for documentation
# ============================================================================

[project]

site_name = "EOEPCA Document Template"
site_url = "https://eoepca.readthedocs.io/projects/template/"
repo_url = "https://github.com/EOEPCA/document-template/"
repo_name = "EOEPCA/document-template"
edit_uri = "edit/main/docs/"

extra_css = ["css/eoepca.css"]

nav = [
  {"EOEPCA Documentation" = "https://eoepca.readthedocs.io/"},
  {"Building-block Name" = [
    {"Introduction" = "index.md"},
    {"Getting Started" = [
      {"Quick Start" = "getting-started/quick-start.md"},
      {"More Getting Started" = "getting-started/more-getting-started.md"}
    ]},
    {"Design" = [
      {"Overview" = "design/overview.md"},
      {"More Design" = "design/more-design.md"}
    ]},
    {"Usage" = [
      {"Tutorials" = "usage/tutorials.md"},
      {"How-tos" = "usage/howtos.md"}
    ]},
    {"Administration" = [
      {"Configuration" = "admin/configuration.md"},
      {"Maintenance" = "admin/maintenance.md"}
    ]},
    {"API" = [
      {"Endpoint Specification" = "api/endpoint-specification.md"},
      {"Usage" = "api/usage.md"}
    ]}
  ]}
]

# ----------------------------------------------------------------------------
# Theme configuration
# ----------------------------------------------------------------------------
[project.theme]

# Use the classic variant to preserve the Material-style look and feel
variant = "classic"
custom_dir = "overrides"
logo = "img/favicon.ico"
favicon = "img/favicon.ico"
language = "en"

features = [
    "navigation.footer",
    "navigation.instant",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.top",
    "content.code.copy",
    "content.action.edit",
]

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = "⚓︎"
toc_depth = 4
[project.markdown_extensions.smarty]
[project.markdown_extensions.sane_lists]
[project.markdown_extensions.admonition]
[project.markdown_extensions.abbr]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.snippets]
auto_append = ["includes/abbreviations.md"]
